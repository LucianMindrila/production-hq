<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production HQ sample job</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:#19312c;font:15px Arial,sans-serif}article{max-width:760px;margin:auto;background:#fff;border:1px solid #dae3db;border-radius:16px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:11px;letter-spacing:.08em;color:#657b6c}.badge{font-size:11px;background:#fff3ce;padding:6px 10px;border-radius:20px;color:#72591e}h2{font-size:24px;margin:14px 0 6px}p{color:#607369;font-size:13px;line-height:1.5}label{display:flex;align-items:center;gap:12px;padding:18px 0;font-weight:600}input{width:24px;height:24px;accent-color:#206647;flex-shrink:0}button{background:#205a40;border:0;border-radius:8px;color:#fff;padding:12px 18px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:36px;margin-bottom:0}input:focus-visible,button:focus-visible{outline:3px solid #bd9539;outline-offset:4px}
</style></head><body><article><div class="top"><span class="tag">DEMO-001 · PRODUCTION HQ · BUILD 0.1.2</span><span class="badge">Sample data</span></div><h2>Connection check</h2><p>This card tests clicking and communication with the server.</p><label><input id="complete" type="checkbox">Confirm the interactive checkbox works</label><button id="test">Test connection</button><p id="connection" role="status" aria-live="polite">Connecting to ChatGPT…</p><p id="status" role="status" aria-live="polite">Tick the checkbox, then test the connection.</p><p>Preview only · Changes are not permanently saved</p></article>
<script>
(() => {
  const checkbox = document.getElementById('complete');
  const button = document.getElementById('test');
  const status = document.getElementById('status');
  const connection = document.getElementById('connection');
  const pending = new Map();
  let ready;
  const compatibilityBridge = () => typeof window.openai?.callTool === 'function';
  let id = 0;
  let busy = false;
  // Only our website opts into direct HTTP. ChatGPT may wrap this card
  // in a same-origin iframe, so parent-origin comparisons are not reliable.
  const website = window.location.pathname === '/test-job.html'
    && new URLSearchParams(window.location.search).get('surface') === 'website';
  const tell = (method, params) => window.parent.postMessage({jsonrpc:'2.0', method, params}, '*');
  const rpc = (method, params) => new Promise((resolve, reject) => {
    const requestId = ++id;
    const timer = setTimeout(() => { pending.delete(requestId); reject(new Error('ChatGPT did not respond to ' + method + '. Reopen the card after refreshing the app connection.')); }, 8000);
    pending.set(requestId, {resolve, reject, timer});
    window.parent.postMessage({jsonrpc:'2.0', id:requestId, method, params}, '*');
  });
  const render = result => {
    const data = result?.structuredContent;
    if (typeof data?.complete === 'boolean') checkbox.checked = data.complete;
  };
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !event.data || typeof event.data !== 'object') return;
    const message = event.data;
    if (pending.has(message.id)) {
      const request = pending.get(message.id);
      pending.delete(message.id); clearTimeout(request.timer);
      if (message.error) request.reject(new Error(message.error.message || 'Host request failed'));
      else request.resolve(message.result);
    }
    if (message.method === 'ui/notifications/tool-result' && !busy) render(message.params);
    if (message.method === 'ui/notifications/tool-input') { /* no inputs needed */ }
  });
  async function websiteCall(name, args) {
    const response = await fetch('/api/mcp', {
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-11-25'},
      body:JSON.stringify({jsonrpc:'2.0',id:++id,method:'tools/call',params:{name,arguments:args}}),
    });
    const body = await response.text();
    if (!response.ok) throw new Error('Server returned HTTP ' + response.status);
    const payload = response.headers.get('content-type')?.includes('text/event-stream')
      ? JSON.parse(body.split('\n').find(line => line.startsWith('data: ')).slice(6)) : JSON.parse(body);
    if (payload.error) throw new Error(payload.error.message);
    return payload.result;
  }
  async function call(name, args) {
    let result;
    if (website) result = await websiteCall(name, args);
    else if (compatibilityBridge()) result = await window.openai.callTool(name, args);
    else {
      await ready;
      result = await rpc('tools/call', {name,arguments:args});
    }
    if (result?.isError) throw new Error(result.content?.find(c=>c.type==='text')?.text || 'Tool returned an error');
    if (typeof result?.structuredContent?.complete !== 'boolean') throw new Error('Server returned no checkbox value');
    return result;
  }
  checkbox.addEventListener('change', () => { status.textContent = 'Preview changed. Test the connection to send this sample value.'; });
  button.addEventListener('click', async () => {
    busy = true; button.disabled = true; checkbox.disabled = true;
    status.textContent = 'Contacting the server…';
    try {
      const result = await call('preview_test_completion', {complete:checkbox.checked});
      render(result);
      status.textContent = 'Connection works. Server received: ' + (checkbox.checked ? 'complete' : 'incomplete') + '. Preview only; nothing was saved.';
    } catch (error) { status.textContent = 'Connection test failed: ' + error.message; }
    finally { busy = false; button.disabled = false; checkbox.disabled = false; }
  });
  async function init() {
    if (website) {
      render(await call('show_rendering_test_job', {}));
      connection.textContent = 'Website test ready.';
      return;
    }
    if (compatibilityBridge()) {
      render({structuredContent:window.openai.toolOutput});
      connection.textContent = 'ChatGPT connection ready.';
      return;
    }
    await rpc('ui/initialize', {appInfo:{name:'production-hq-rendering-test',version:'0.1.2'},appCapabilities:{},protocolVersion:'2026-01-26'});
    tell('ui/notifications/initialized', {});
    new ResizeObserver(() => tell('ui/notifications/size-changed', {height:document.documentElement.scrollHeight})).observe(document.body);
    connection.textContent = 'ChatGPT connection ready.';
  }
  ready = init();
  ready.catch(error => { connection.textContent = 'Connection setup failed: ' + error.message; });
})();
</script></body></html>
